<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Alert Mapper</title>
<meta name="description" content="Where a Uniden R7 radar detector picked up radar around Detroit. Slow down in the hot spots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Layout: full-height map app. Desktop: control rail on the left, map on the right.
   Phone: header, filters, map, then the alert list; alert details slide up over the map. */
:root {
  --bg: #F3F4F1;          /* concrete */
  --panel: #FFFFFF;
  --ink: #1C2321;         /* asphalt */
  --muted: #5D6763;
  --line: #DADDD7;
  --sign: #0F5B3A;        /* highway sign green */
  --sign-ink: #FFFFFF;
  --ka: #C8372D;
  --k: #D99206;
  --x: #2F6FA3;
  --false: #8A938F;
  --chip: #E8EAE5;
  --shadow: 0 6px 24px rgba(20, 30, 25, .18);
  --display: "Overpass", "Highway Gothic", "Arial Narrow", Arial, sans-serif;
  --body: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1A201E; --ink: #E7EBE8; --muted: #9AA49F; --line: #2C3431;
    --sign: #1F8A5A; --sign-ink: #FFFFFF; --ka: #FF5A4E; --k: #FFB42E; --x: #5AA2E0;
    --false: #7D8783; --chip: #252C29; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1A201E; --ink: #E7EBE8; --muted: #9AA49F; --line: #2C3431;
  --sign: #1F8A5A; --sign-ink: #FFFFFF; --ka: #FF5A4E; --k: #FFB42E; --x: #5AA2E0;
  --false: #7D8783; --chip: #252C29; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body);
  display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 100%;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--k); outline-offset: 2px; }

/* ---- left rail ---- */
.rail {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.sign {
  background: var(--sign); color: var(--sign-ink);
  padding-block: 18px 16px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  padding-top: max(18px, env(safe-area-inset-top, 0px));
}
.sign h1 {
  margin: 0; font: 800 26px/1.05 var(--display); letter-spacing: .01em; text-wrap: balance;
}
.sign p { margin: 6px 0 0; font-size: 14px; opacity: .92; }
.sign .slow {
  display: inline-block; margin-top: 10px; padding: 3px 8px 1px; border: 2px solid currentColor;
  border-radius: 4px; font: 800 12px/1.3 var(--display); letter-spacing: .12em; text-transform: uppercase;
}

.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line);
}
.stat { padding: 12px 8px 10px; text-align: center; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat.ka b { color: var(--ka); } .stat.k b { color: var(--k); }

.controls { display: grid; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row > label.cap {
  width: 100%; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  border: 1px solid var(--line); background: var(--chip); border-radius: 999px;
  padding: 5px 12px 3px; cursor: pointer; font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
select {
  border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 6px 10px 4px;
  max-width: 100%;
}
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--sign); }

.list { overflow-y: auto; min-height: 0; flex: 1; padding-bottom: env(safe-area-inset-bottom, 0px); }
.day {
  position: sticky; top: 0; background: var(--panel); z-index: 1;
  padding: 10px 18px 6px; font: 800 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--line);
}
.item {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; width: 100%;
  padding: 9px 18px; border: 0; border-bottom: 1px solid var(--line); background: none;
  text-align: left; cursor: pointer;
}
.item:hover, .item.on { background: var(--chip); }
.item .f { font: 700 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.item .s { font-size: 12px; color: var(--muted); }
.item .tm { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.item.false { opacity: .6; }
.pill {
  font: 800 13px/1 var(--display); text-align: center; padding: 5px 0 3px; border-radius: 4px;
  color: #fff; letter-spacing: .02em;
}
.pill.Ka { background: var(--ka); } .pill.K { background: var(--k); color: #1C1405; }
.pill.X { background: var(--x); } .pill.q, .pill.false { background: var(--false); }
.foot { padding: 10px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---- map ---- */
.mapwrap { position: relative; min-width: 0; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.legend {
  position: absolute; z-index: 500; left: 12px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); color: var(--ink); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 12px; font-size: 12px; display: grid; gap: 4px; max-width: calc(100% - 24px);
}
.ramp { height: 8px; width: 150px; max-width: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #2E9E6B, #F2C200, #E36A1A, #C8372D); }
.ramp-l { display: flex; justify-content: space-between; color: var(--muted); }

/* ---- alert detail card ---- */
.card {
  position: absolute; z-index: 1000; right: 12px; top: 12px; width: 330px; max-width: calc(100% - 24px);
  max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--panel); border-radius: 10px; box-shadow: var(--shadow);
}
.card img { display: block; width: 100%; aspect-ratio: 1030 / 430; object-fit: cover; background: #000;
  border-radius: 10px 10px 0 0; }
.card .noimg { aspect-ratio: 1030 / 430; display: grid; place-items: center; background: #000; color: #888;
  border-radius: 10px 10px 0 0; font-size: 13px; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 10px; }
.readout { display: flex; align-items: baseline; gap: 10px; }
.readout .pill { padding: 6px 10px 4px; font-size: 16px; }
.readout .fq { font: 700 28px/1 var(--mono); font-variant-numeric: tabular-nums; }
.readout .fq small { font-size: 14px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0; }
.kv div { min-width: 0; }
.kv dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; vertical-align: -1px; margin-right: 6px; }
.bars i { width: 4px; background: var(--line); border-radius: 1px; }
.bars i.on { background: var(--k); }
.close {
  position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
}
.note { font-size: 12px; color: var(--muted); margin: 0; }
.empty { padding: 24px 18px; color: var(--muted); }

.leaflet-container { font: inherit; }
.leaflet-control-attribution { font-size: 10px; }
.tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }

/* ---- phone ---- */
@media (max-width: 760px) {
  body { display: flex; flex-direction: column; height: auto; }
  .sign { order: 1; } .stats { order: 2; } .controls { order: 3; } .mapwrap { order: 4; } .list { order: 5; } .foot { order: 6; }
  .rail { border-right: 0; display: contents; }
  .sign { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sign h1 { font-size: 22px; }
  .controls { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); }
  .stats { background: var(--panel); }
  .mapwrap { height: 62vh; min-height: 340px; }
  .list { overflow: visible; background: var(--panel); }
  .day { position: static; }
  .card { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 70%; }
  .card img, .card .noimg { aspect-ratio: 1030 / 360; }
  .legend { bottom: 12px; }
  .card:not([hidden]) ~ .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<aside class="rail">
  <header class="sign">
    <h1>Radar Alert Mapper</h1>
    <p>Every spot where my Uniden R7 radar detector picked up radar, logged with GPS while driving around Detroit.</p>
    <span class="slow">Hot spot ahead: slow down</span>
  </header>

  <div class="stats" aria-label="Totals for what is shown">
    <div class="stat"><b id="sAll">0</b><span>Alerts</span></div>
    <div class="stat ka"><b id="sKa">0</b><span>Ka</span></div>
    <div class="stat k"><b id="sK">0</b><span>K</span></div>
    <div class="stat"><b id="sDays">0</b><span>Drive days</span></div>
  </div>

  <div class="controls">
    <div class="row" role="group" aria-label="Band">
      <label class="cap">Band</label>
      <button class="chip" id="bAll" data-band="all" aria-pressed="true">All</button>
      <button class="chip" data-band="Ka" aria-pressed="false"><span class="dot" style="background:var(--ka)"></span>Ka</button>
      <button class="chip" data-band="K" aria-pressed="false"><span class="dot" style="background:var(--k)"></span>K</button>
      <button class="chip" data-band="X" aria-pressed="false" id="bX" hidden><span class="dot" style="background:var(--x)"></span>X</button>
    </div>
    <div class="row" role="group" aria-label="Map view">
      <label class="cap">Show on map</label>
      <button class="chip" data-view="both" aria-pressed="true">Heat + spots</button>
      <button class="chip" data-view="heat" aria-pressed="false">Heat</button>
      <button class="chip" data-view="dots" aria-pressed="false">Spots</button>
    </div>
    <div class="row">
      <label class="cap" for="day">Drive day</label>
      <select id="day"><option value="all">All days</option></select>
    </div>
    <label class="toggle"><input type="checkbox" id="showFalse"> Show false alerts (grey)</label>
  </div>

  <div class="list" id="list" aria-label="Alert list"></div>
  <div class="foot" id="foot">Loading alerts…</div>
</aside>

<main class="mapwrap">
  <div id="map" role="application" aria-label="Map of radar alerts"></div>
  <article class="card" id="card" hidden></article>
  <div class="legend" id="legend">
    <div class="ramp"></div>
    <div class="ramp-l"><span>1 alert</span><span>many alerts</span></div>
    <div><span class="dot" style="background:var(--ka)"></span> Ka &nbsp; <span class="dot" style="background:var(--k)"></span> K &nbsp; Tap a spot for the R7 screen</div>
  </div>
</main>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script>
(function () {
  "use strict";
  var TZ = "America/New_York";
  var state = { band: "all", view: "both", day: "all", showFalse: false, selected: null };
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }

  // ---------- map ----------
  var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  var dt = document.documentElement.getAttribute("data-theme");
  if (dt) dark = dt === "dark";
  var map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([42.38, -83.1], 12);
  // OpenStreetMap's own tiles need no account or key; in dark mode they are dimmed with a CSS filter
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, className: dark ? "tiles-dark" : "",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  L.control.scale({ imperial: true, metric: false }).addTo(map);
  var heat = null, dots = L.layerGroup().addTo(map);

  // ---------- data ----------
  var all = [];
  var fmtDay = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric", year: "numeric" });
  var fmtTime = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit" });
  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

  function prep(raw) {
    return raw.map(function (a, i) {
      var d = new Date(a.t.replace(" ", "T") + "Z");
      return Object.assign({}, a, {
        id: i, date: d, dayKey: fmtKey.format(d), dayLabel: fmtDay.format(d), time: fmtTime.format(d),
        isFalse: a.status !== "Valid", band: a.band || "?"
      });
    }).sort(function (x, y) { return y.date - x.date; });
  }

  function color(a) {
    if (a.isFalse) return tok("--false");
    return { Ka: tok("--ka"), K: tok("--k"), X: tok("--x") }[a.band] || tok("--false");
  }

  function shown() {
    return all.filter(function (a) {
      if (a.isFalse && !state.showFalse) return false;
      if (state.band !== "all" && a.band !== state.band) return false;
      if (state.day !== "all" && a.dayKey !== state.day) return false;
      return true;
    });
  }

  var REASONS = { muted: "Q-Ride", repeat_K: "same spot many days", known_spot: "known false spot" };
  function why(a) { return a.reason ? " (" + esc(REASONS[a.reason] || a.reason) + ")" : ""; }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---------- draw ----------
  function draw(fit) {
    var rows = shown();
    var real = rows.filter(function (a) { return !a.isFalse; });
    document.getElementById("sAll").textContent = real.length;
    document.getElementById("sKa").textContent = real.filter(function (a) { return a.band === "Ka"; }).length;
    document.getElementById("sK").textContent = real.filter(function (a) { return a.band === "K"; }).length;
    document.getElementById("sDays").textContent = new Set(real.map(function (a) { return a.dayKey; })).size;

    if (heat) { map.removeLayer(heat); heat = null; }
    dots.clearLayers();
    if (state.view !== "dots" && real.length) {
      heat = L.heatLayer(real.map(function (a) { return [a.lat, a.lon, 1]; }), {
        radius: 26, blur: 20, minOpacity: 0.35, max: 4,
        gradient: { 0.25: "#2E9E6B", 0.5: "#F2C200", 0.75: "#E36A1A", 1: "#C8372D" }
      }).addTo(map);
    }
    if (state.view !== "heat") {
      rows.slice().reverse().forEach(function (a) {
        var m = L.circleMarker([a.lat, a.lon], {
          radius: a.isFalse ? 5 : 7, weight: 2, color: "#fff",
          fillColor: color(a), fillOpacity: a.isFalse ? 0.55 : 0.95
        });
        m.on("click", function () { select(a, false); });
        m.bindTooltip(a.band + " " + (a.freq || "") + " · " + a.time, { direction: "top" });
        m.addTo(dots);
      });
    }
    drawList(rows);
    if (fit && rows.length) {
      map.fitBounds(L.latLngBounds(rows.map(function (a) { return [a.lat, a.lon]; })), { padding: [40, 40], maxZoom: 15 });
    }
  }

  function drawList(rows) {
    var el = document.getElementById("list");
    if (!rows.length) { el.innerHTML = '<p class="empty">No alerts match these filters.</p>'; return; }
    var html = "", lastDay = "";
    rows.forEach(function (a) {
      if (a.dayKey !== lastDay) { html += '<div class="day">' + esc(a.dayLabel) + "</div>"; lastDay = a.dayKey; }
      var cls = a.isFalse ? "false" : (a.band === "?" ? "q" : a.band);
      html += '<button class="item' + (a.isFalse ? " false" : "") + (state.selected === a.id ? " on" : "") + '" data-id="' + a.id + '">' +
        '<span class="pill ' + esc(cls) + '">' + esc(a.band) + "</span>" +
        '<span><span class="f">' + esc(a.freq || "?") + ' GHz</span><br><span class="s">' +
        (a.isFalse ? "False alert" + why(a) : (a.len != null ? a.len + " s long" : "") + (a.mph != null ? " · " + a.mph + " mph" : "")) +
        '</span></span><span class="tm">' + esc(a.time) + "</span></button>";
    });
    el.innerHTML = html;
  }

  function bars(n) {
    var h = "";
    for (var i = 1; i <= 8; i++) h += '<i class="' + (i <= n ? "on" : "") + '" style="height:' + (4 + i * 1.25) + 'px"></i>';
    return '<span class="bars" aria-hidden="true">' + h + "</span>";
  }

  function select(a, fly) {
    state.selected = a.id;
    var card = document.getElementById("card");
    var cls = a.isFalse ? "false" : (a.band === "?" ? "q" : a.band);
    card.innerHTML =
      '<button class="close" id="cardClose" aria-label="Close">×</button>' +
      (a.photo ? '<a href="' + esc(a.photo) + '" target="_blank" rel="noopener"><img src="' + esc(a.photo) + '" alt="R7 screen during this alert: ' + esc(a.band) + " " + esc(a.freq) + ' GHz"></a>'
               : '<div class="noimg">No photo for this alert</div>') +
      '<div class="body">' +
        '<div class="readout"><span class="pill ' + esc(cls) + '">' + esc(a.band) + '</span><span class="fq">' + esc(a.freq || "?") + ' <small>GHz</small></span></div>' +
        '<dl class="kv">' +
          "<div><dt>When</dt><dd>" + esc(a.time) + "</dd></div>" +
          "<div><dt>Day</dt><dd>" + esc(a.dayLabel.replace(/, \d{4}$/, "")) + "</dd></div>" +
          "<div><dt>Alert length</dt><dd>" + (a.len != null ? a.len + " s" : "–") + "</dd></div>" +
          "<div><dt>My speed</dt><dd>" + (a.mph != null ? a.mph + " mph" : "–") + "</dd></div>" +
          "<div><dt>Signal</dt><dd>" + (a.bars != null ? bars(a.bars) + a.bars + " bars" : "–") + "</dd></div>" +
          "<div><dt>Status</dt><dd>" + (a.isFalse ? "False alert" + why(a) : "Real alert") + "</dd></div>" +
        "</dl>" +
        (a.reason && !a.isFalse ? '<p class="note">Logged ' + esc(a.reason) + " alert.</p>" : "") +
        '<p class="note">Tap the photo to see it full size.</p>' +
      "</div>";
    card.hidden = false;
    document.getElementById("cardClose").onclick = function () { card.hidden = true; state.selected = null; drawList(shown()); };
    if (fly) map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 15), { duration: 0.6 });
    drawList(shown());
  }

  // ---------- controls ----------
  function pressGroup(attr, value) {
    document.querySelectorAll("[data-" + attr + "]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset[attr] === value));
    });
  }
  document.querySelectorAll("[data-band]").forEach(function (b) {
    b.addEventListener("click", function () { state.band = b.dataset.band; pressGroup("band", state.band); draw(true); });
  });
  document.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { state.view = b.dataset.view; pressGroup("view", state.view); draw(false); });
  });
  document.getElementById("day").addEventListener("change", function (e) { state.day = e.target.value; draw(true); });
  document.getElementById("showFalse").addEventListener("change", function (e) { state.showFalse = e.target.checked; draw(false); });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest(".item"); if (!b) return;
    var a = all.find(function (x) { return x.id === +b.dataset.id; });
    if (a) {
      select(a, true);
      if (window.innerWidth <= 760) document.querySelector(".mapwrap").scrollIntoView({ behavior: "smooth" });
    }
  });

  // ---------- start ----------
  function start() {
    var data = window.RADAR_DATA;
    if (!data) { document.getElementById("foot").textContent = "Could not load the alert data (data.js)."; return; }
    all = prep(data.alerts || []);
    var days = [];
    all.forEach(function (a) { if (days.indexOf(a.dayKey) < 0) days.push(a.dayKey); });
    var sel = document.getElementById("day");
    days.forEach(function (k) {
      var a = all.find(function (x) { return x.dayKey === k; });
      var o = document.createElement("option"); o.value = k; o.textContent = a.dayLabel; sel.appendChild(o);
    });
    document.getElementById("bX").hidden = !all.some(function (a) { return a.band === "X"; });
    var up = new Date(data.updated.replace(" ", "T") + "Z");
    document.getElementById("foot").textContent = "Updated " + fmtDay.format(up) + ", " + fmtTime.format(up) +
      ". Alerts are logged automatically by a Raspberry Pi reading the R7 screen with a camera.";
    draw(true);
  }
  // load the data fresh every time so a new drive shows up without a stale copy
  var s = document.createElement("script");
  s.src = "data.js?v=" + Date.now();
  s.onload = start;
  s.onerror = start;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
